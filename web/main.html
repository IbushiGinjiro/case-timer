<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>case-timer</title>
<link rel="stylesheet" href="common.css">
<style>
html, body { overflow: hidden; height: 100%; }
/* 背景は透明（筐体のまわりはデスクトップが見える。app/main.py の KEY_COLOR を参照） */
html, body { background: transparent; }
body { padding: 12px 0 0 12px; color: #eee; }
.stage { position: relative; width: 540px; user-select: none; }

/* ===== 筐体 ===== */
/* 外枠（黒）と筐体の両方の角を8pxずつ欠いて、角も黒い線が階段状につながるようにする */
.frame { width: 460px; padding: 4px; background: var(--ink); clip-path: polygon(0 8px, 8px 8px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)); }
.device {
  position: relative; padding: 20px 24px 18px;
  background: var(--case); color: var(--ink);
  box-shadow: inset 6px 6px 0 var(--case-hi), inset -6px -6px 0 var(--case-lo);
  clip-path: polygon(0 8px, 8px 8px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px));
}
.brand { display: flex; justify-content: space-between; align-items: baseline; margin: 0 14px 12px; padding: 2px 0; cursor: move; }
.brand b { font-family: var(--px); font-size: 13px; letter-spacing: 1px; }
.brand span { font-family: var(--px); font-size: 8px; }

.selects { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.sel label { display: block; font-family: var(--px); font-size: 8px; margin-bottom: 4px; }
.sel select {
  width: 100%; font-family: var(--jp); font-size: 15px; padding: 5px 6px;
  background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 0;
  box-shadow: inset 3px 3px 0 #0002; outline: none; cursor: pointer;
}

/* ===== スイッチ：消灯時は暗い色。点灯するとボタン全体がほんわり明滅する ===== */
.switches { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 16px; }
.sw { position: relative; height: 110px; font-family: var(--px); font-size: 14px; border: 4px solid var(--ink); cursor: pointer; border-radius: 0; transition: transform .04s; outline: none; }
.sw.green { background: #1d7a33; color: #0b2c14; box-shadow: inset 6px 6px 0 #2f9a4a, inset -6px -6px 0 #0f4f1f, 0 6px 0 var(--ink); }
.sw.red   { background: #8a2226; color: #2e0a0b; box-shadow: inset 6px 6px 0 #a83a3c, inset -6px -6px 0 #5a1013, 0 6px 0 var(--ink); }
.sw:active { transform: translateY(5px); }
.sw.green.lit { background: var(--green); color: var(--ink); animation: litGreen 2.4s ease-in-out infinite; }
.sw.red.lit   { background: var(--red);   color: var(--ink); animation: litRed 2.4s ease-in-out infinite; }
.sw.green.lit.pause { background: var(--amber); animation: litAmber 1.6s ease-in-out infinite; }
@keyframes litGreen {
  0%,100% { box-shadow: inset 6px 6px 0 var(--green-hi), inset -6px -6px 0 var(--green-lo), 0 6px 0 var(--ink), 0 0 4px 0 #8dff9f55; filter: brightness(1); }
  50%     { box-shadow: inset 6px 6px 0 var(--green-hi), inset -6px -6px 0 var(--green-lo), 0 6px 0 var(--ink), 0 0 30px 10px #8dff9fbb; filter: brightness(1.22); } }
@keyframes litRed {
  0%,100% { box-shadow: inset 6px 6px 0 var(--red-hi), inset -6px -6px 0 var(--red-lo), 0 6px 0 var(--ink), 0 0 4px 0 #ff9c9c55; filter: brightness(1); }
  50%     { box-shadow: inset 6px 6px 0 var(--red-hi), inset -6px -6px 0 var(--red-lo), 0 6px 0 var(--ink), 0 0 30px 10px #ff9c9cbb; filter: brightness(1.18); } }
@keyframes litAmber {
  0%,100% { box-shadow: inset 6px 6px 0 #ffe08a, inset -6px -6px 0 #b67a00, 0 6px 0 var(--ink), 0 0 4px 0 #ffd06655; filter: brightness(.9); }
  50%     { box-shadow: inset 6px 6px 0 #ffe08a, inset -6px -6px 0 #b67a00, 0 6px 0 var(--ink), 0 0 30px 10px #ffd066bb; filter: brightness(1.2); } }
@keyframes glow { 0%,100% { box-shadow: 0 0 2px var(--green-hi); } 50% { box-shadow: 0 0 14px 6px var(--green-hi); } }
@keyframes blink { 50% { background: #333; } }
.sw.flash { animation: flash .35s steps(2) 1 !important; }

/* ===== LCD ===== */
.lcd { background: var(--lcd-bg); border: 4px solid var(--ink); padding: 10px 14px; box-shadow: inset 4px 4px 0 #000a; cursor: zoom-out; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.lcd .state { font-family: var(--px); font-size: 9px; color: var(--lcd-on); line-height: 1.6; }
.lcd .time { font-family: var(--px); font-size: 30px; text-align: right; color: var(--lcd-on); text-shadow: 0 0 6px #7dff6b88; letter-spacing: 2px; }
.lcd.idle .time { color: var(--lcd-off); text-shadow: none; }
.paused .lcd .time { animation: blinktext 1s steps(1) infinite; }
@keyframes blinktext { 50% { color: var(--lcd-off); text-shadow: none; } }
.lcd .now { grid-column: 1 / -1; font-size: 13px; color: var(--lcd-on); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.preset { font-family: var(--jp); font-size: 12px; padding: 5px 6px; background: var(--ink); color: #fff; border: 2px solid var(--ink); text-align: left; cursor: pointer; border-radius: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.preset i { font-style: normal; font-family: var(--px); font-size: 8px; color: var(--case); margin-right: 4px; }
.preset.empty { color: #888; }
.preset.active { outline: 3px solid #fff; outline-offset: -5px; }
.preset.saved { animation: flash .35s steps(2) 2; }

/* ===== りゅうず（ねじ） ===== */
.crown-base { position: absolute; left: 456px; top: 74px; width: 16px; height: 26px; background: #777; border: 3px solid var(--ink); border-left: none; }
.crown-arm { --len: 0px; --deg: 0deg; position: absolute; left: 472px; top: 70px; height: 34px; transform-origin: 0 50%; transform: rotate(var(--deg)); cursor: grab; touch-action: none; display: flex; align-items: center; }
.crown-arm.spring { transition: transform .18s steps(4); }
.crown-arm.spring .stem { transition: width .18s steps(4); }
.crown-arm.clunk { transition: transform .11s cubic-bezier(.25, 1.9, .45, 1); }
.crown-arm.kochi .stem { transition: width .08s cubic-bezier(.3, 1.7, .5, 1); }
.crown-arm .stem { width: calc(14px + var(--len)); height: 10px; background: #bbb; border: 3px solid var(--ink); border-left: none; box-shadow: inset 0 3px 0 #eee; }
.crown-arm .head { width: 22px; height: 34px; border: 3px solid var(--ink); background: repeating-linear-gradient(90deg, #ddd 0 3px, #888 3px 6px); }
.tick .frame { animation: tick .1s steps(2) 1; }
@keyframes tick { 50% { transform: translate(1px, 0); } }
.shake .frame { animation: shake .16s steps(2) 1; }
@keyframes shake { 33% { transform: translate(1px, 3px); } 66% { transform: translate(-1px, -1px); } }
.crown-hint { position: absolute; left: 464px; top: 160px; font-family: var(--px); font-size: 8px; color: var(--ink); white-space: nowrap; opacity: 0; transition: opacity .1s; }
.crown-hint.show { opacity: 1; }

/* ===== 編集パネル ===== */
.edit { position: absolute; inset: 10px; background: #1d1e2e; color: #eee; border: 4px solid var(--ink); padding: 12px; overflow: auto; font-size: 13px; display: none; z-index: 5; }
.editing .edit { display: block; }
.edit h3 { font-family: var(--px); font-size: 10px; color: var(--case); margin: 14px 0 6px; }
.edit h3:first-child { margin-top: 0; }
.edit .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.edit ul { list-style: none; margin: 0; padding: 0; border: 2px solid #444; height: 116px; overflow: auto; }
.edit li { display: flex; gap: 4px; align-items: center; padding: 3px 4px 3px 6px; cursor: pointer; }
.edit li span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.edit li.on { background: #3a3c5c; }
.edit li button { font-size: 10px; padding: 1px 4px; }
.edit li input { flex: 1; min-width: 0; }
.edit input, .edit select, .edit button { font-family: var(--jp); font-size: 12px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 0; padding: 2px 4px; }
.edit button { cursor: pointer; }
.edit .row { display: flex; gap: 4px; margin-top: 5px; align-items: center; }
.edit .row input { flex: 1; min-width: 0; }
.edit .prow { display: grid; grid-template-columns: 92px 1fr 1fr; gap: 4px; margin-bottom: 4px; align-items: center; }
.edit .prow input { width: 100%; }
.edit .note { color: #aaa; font-size: 11px; margin-top: 4px; line-height: 1.6; }
.edit .note button { font-size: 10px; padding: 0 4px; }
.edit .err { color: #ff8a82; font-size: 11px; }
.edit .path { font-size: 11px; color: #ccc; word-break: break-all; flex: 1; }
.edit .close { margin-top: 14px; width: 100%; padding: 7px; font-family: var(--px); font-size: 9px; background: var(--case); }
.edit .ver { margin-top: 8px; text-align: right; font-family: var(--px); font-size: 7px; color: #777; }
.edit .quit { margin-top: 6px; width: 100%; padding: 5px; background: #3a3c5c; color: #eee; border-color: #555; }

/* ===== ダイアログ ===== */
.dialog { position: absolute; left: 30px; right: 30px; top: 70px; background: var(--paper); color: var(--ink); border: 4px solid var(--ink); box-shadow: 6px 6px 0 #0008; padding: 16px; display: none; z-index: 6; font-size: 15px; line-height: 1.6; }
.dialog.show { display: block; }
.dialog small { color: var(--muted); }
.dialog .btns { display: flex; gap: 10px; margin-top: 14px; }
.dialog button { flex: 1; font-family: var(--jp); font-size: 14px; padding: 8px; border: 3px solid var(--ink); border-radius: 0; cursor: pointer; background: #fff; }
.dialog .primary { background: var(--case); }

/* ===== ミニモード：時間と名前だけの細いバー ===== */
.mini { display: none; align-items: center; gap: 10px; height: 52px; padding: 0 12px; background: var(--case); color: var(--ink); border: 4px solid var(--ink); user-select: none; }
body.minimode { padding: 0; }
.minimode .mini { display: flex; }
.minimode .stage { display: none; }
.mini .mled { width: 14px; height: 14px; border: 2px solid var(--ink); background: #333; flex: none; }
.running .mini .mled, .running.mini .mled { background: var(--green-hi); animation: glow 2.4s ease-in-out infinite; }
.paused .mini .mled { background: var(--amber); animation: blink 1s steps(1) infinite; }
.mini .mname { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: move; }
.mini .mtime { font-family: var(--px); font-size: 14px; cursor: zoom-in; padding: 6px 0; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="frame" id="frame"><div class="device" id="device">
    <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
    <div class="brand pywebview-drag-region" title="ドラッグで移動"><b class="pywebview-drag-region">CASE-TIMER</b><span class="pywebview-drag-region">CT-1</span></div>

    <div class="selects">
      <div class="sel"><label>PROJECT</label><select id="prj"></select></div>
      <div class="sel"><label>TASK</label><select id="task"></select></div>
    </div>

    <div class="switches">
      <button class="sw green" id="start">START</button>
      <button class="sw red" id="stop">STOP</button>
    </div>

    <div class="lcd idle" id="lcd" title="ダブルクリックでミニモード">
      <div class="state" id="state">STOP</div>
      <div class="time" id="time">00:00:00</div>
      <div class="now" id="now">―</div>
    </div>

    <div class="presets" id="presets"></div>

    <div class="edit" id="edit"></div>
    <div class="dialog" id="dialog"><div id="dialogText"></div><div class="btns" id="dialogBtns"></div></div>
  </div></div>

  <div class="crown-base"></div>
  <div class="crown-arm spring" id="crown"><div class="stem"></div><div class="head"></div></div>
  <div class="crown-hint" id="hint"></div>
</div>

<div class="mini" id="mini">
  <span class="mled"></span>
  <span class="mname pywebview-drag-region" id="mname">―</span>
  <span class="mtime" id="mtime" title="ダブルクリックで元に戻す">00:00:00</span>
</div>

<script>
const $ = id => document.getElementById(id);
const api = () => window.pywebview.api;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const stage = $("stage"), prjSel = $("prj"), taskSel = $("task");

const S = { projects: [], selection: {}, timer: { status: "idle", elapsed: 0 }, presets: [null, null, null], settings: null, hotkeyErrors: {}, dataDir: "" };
let base = { elapsed: 0, at: performance.now() };
let editMode = false, editPrj = null, renaming = null;

// ================= 状態の反映 =================
function applyState(st) {
  if (st.timer) { S.timer = st.timer; base = { elapsed: st.timer.elapsed, at: performance.now() }; }
  if (st.presets) S.presets = st.presets;
  if (st.projects) S.projects = st.projects;
  if (st.selection) { S.selection = st.selection; fillSelects(); }
  render();
}
const findPrj = id => S.projects.find(p => p.id === id);
const findTask = id => { for (const p of S.projects) { const t = p.tasks.find(t => t.id === id); if (t) return t; } };

function fillSelects() {
  const { project_id, task_id } = S.selection;
  const live = S.projects.filter(p => !p.done);
  prjSel.innerHTML = '<option value="">-- 選択 --</option>' + live.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  prjSel.value = project_id && live.some(p => p.id === project_id) ? project_id : "";
  fillTasks(+prjSel.value || null, task_id);
}
function fillTasks(pid, tid) {
  const p = findPrj(pid), ts = p ? p.tasks.filter(t => !t.done) : [];
  taskSel.innerHTML = '<option value="">-- 選択 --</option>' + ts.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
  taskSel.value = tid && ts.some(t => t.id === tid) ? tid : "";
}
const selected = () => ({ project_id: +prjSel.value || null, task_id: +taskSel.value || null });
prjSel.onchange = () => { fillTasks(+prjSel.value || null, null); syncSelection(); };
taskSel.onchange = syncSelection;
function syncSelection() { S.selection = selected(); api().set_selection(S.selection.project_id, S.selection.task_id); }

const fmt = sec => { const s = Math.floor(sec); return [s / 3600, s / 60 % 60, s % 60].map(n => String(Math.floor(n)).padStart(2, "0")).join(":"); };
const elapsedNow = () => base.elapsed + (S.timer.status === "running" ? (performance.now() - base.at) / 1000 : 0);

function render() {
  const st = S.timer.status;
  for (const el of [stage, document.body]) { el.classList.toggle("running", st === "running"); el.classList.toggle("paused", st === "paused"); }
  $("lcd").classList.toggle("idle", st === "idle");
  $("start").classList.toggle("lit", st !== "idle");
  $("start").classList.toggle("pause", st === "paused");
  $("stop").classList.toggle("lit", st === "idle");
  $("state").textContent = { idle: "STOP", running: "REC", paused: "PAUSE" }[st];
  const label = st === "idle" ? "―" : S.timer.label;
  $("now").textContent = label; $("mname").textContent = label;
  renderPresets();
  tick();
}
function tick() { const t = fmt(elapsedNow()); $("time").textContent = t; $("mtime").textContent = t; }
setInterval(tick, 250);

function renderPresets() {
  $("presets").innerHTML = S.presets.map((p, i) => {
    const active = S.timer.status !== "idle" && p && p.task_id === S.timer.task_id;
    return `<button class="preset${p ? "" : " empty"}${active ? " active" : ""}" data-i="${i}" title="${esc(p ? p.full : "Ctrl+Alt+Shift+" + (i + 1) + " で今の選択を登録")}"><i>${i + 1}</i>${esc(p ? p.label : "未登録")}</button>`;
  }).join("");
}
$("presets").onclick = async e => {
  const b = e.target.closest(".preset"); if (!b) return;
  const r = await api().use_preset(+b.dataset.i);
  if (r.result === "empty") return flash(b);
  applyState(r);
};

function flash(el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 400); }

// ================= START / STOP =================
$("start").onclick = async () => {
  const s = selected();
  if (!s.project_id || !s.task_id) return flash($("start"));
  const r = await api().press_start(s.project_id, s.task_id);
  if (r.result === "invalid") flash($("start"));
  applyState(r);
};
$("stop").onclick = async () => {
  const r = await api().press_stop();
  if (r.result === "invalid") flash($("stop"));
  applyState(r);
};

// ================= Pythonからの通知 =================
window.ct = {
  onEvent(name, p) {
    if (name === "state") applyState(p);
    if (name === "toggleEdit") setEdit(!editMode);
    if (name === "flash" && p.result === "invalid") flash($("start"));
    if (name === "flash" && p.result === "empty") flash($("presets").children[p.preset]);
    if (name === "presetSaved") { const el = $("presets").children[p.preset]; el.classList.add("saved"); setTimeout(() => el.classList.remove("saved"), 800); if (editMode) renderEdit(); }
    if (name === "idleReturn") {
      showDialog(`<b>${p.start}〜${p.end}</b>（${p.minutes}分）操作がありませんでした。<br>休憩として作業時間から除外しますか？<br><small>${esc(p.label)}</small>`,
        [["除外する", true, async () => applyState(await api().resolve_idle(true))], ["作業に含める", false, async () => applyState(await api().resolve_idle(false))]]);
    }
  },
};

// ================= ダイアログ =================
function showDialog(html, buttons) {
  if (document.body.classList.contains("minimode")) setMini(false);
  $("dialogText").innerHTML = html;
  $("dialogBtns").innerHTML = "";
  buttons.forEach(([label, primary, fn]) => {
    const b = document.createElement("button"); b.textContent = label; if (primary) b.className = "primary";
    b.onclick = async () => { $("dialog").classList.remove("show"); await fn(); };
    $("dialogBtns").appendChild(b);
  });
  $("dialog").classList.add("show");
}
function toast(text) {
  showDialog(esc(text), [["OK", true, () => {}]]);
}

// ================= 編集モード =================
function setEdit(on) {
  editMode = on;
  $("device").classList.toggle("editing", on);
  setArm(on ? PULL : 0, 0);
  $("hint").textContent = on ? "EDIT" : ""; $("hint").classList.toggle("show", on);
  renaming = null;
  reportShapeSoon();
  if (on) { editPrj = editPrj && findPrj(editPrj) && !findPrj(editPrj).done ? editPrj : (S.selection.project_id || S.projects.find(p => !p.done)?.id || null); renderEdit(); }
}
const opt = (list, sel, placeholder = "-- 選択 --") => `<option value="">${placeholder}</option>` + list.map(x => `<option value="${x.id}" ${x.id === sel ? "selected" : ""}>${esc(x.name)}</option>`).join("");

function itemHtml(kind, x) {
  const on = kind === "prj" && x.id === editPrj ? " on" : "";
  if (renaming && renaming.kind === kind && renaming.id === x.id)
    return `<li class="${on}"><input id="renameInput" value="${esc(x.name)}"><button data-act="rename-save">保存</button></li>`;
  return `<li class="${on}" data-kind="${kind}" data-id="${x.id}"><span title="${esc(x.name)}">${esc(x.name)}</span><button data-act="rename" title="名前を変更">✎</button><button data-act="done">完了にする</button></li>`;
}

function renderEdit() {
  const p = findPrj(editPrj), s = S.settings, hk = s.hotkeys, errs = S.hotkeyErrors || {};
  const live = S.projects.filter(x => !x.done), doneP = S.projects.filter(x => x.done);
  const liveT = p ? p.tasks.filter(t => !t.done) : [], doneT = p ? p.tasks.filter(t => t.done) : [];
  const fixedP = findPrj(s.fixed_project_id);
  const hkErr = name => errs[name] || errs[name.replace("preset", "save")] ? `<div class="err">${esc(errs[name] || "Shift付きの登録キー：" + errs[name.replace("preset", "save")])}</div>` : "";
  $("edit").innerHTML = `
    <h3>PROJECT / TASK</h3>
    <div class="cols">
      <div>
        <ul>${live.map(x => itemHtml("prj", x)).join("")}</ul>
        <div class="row"><input id="newPrj" placeholder="新しいプロジェクト"><button id="addPrj">追加</button></div>
        ${doneP.length ? `<div class="note">完了：${doneP.map(x => `${esc(x.name)} <button data-reopen-prj="${x.id}">再開</button>`).join(" ")}</div>` : ""}
      </div>
      <div>
        <ul>${liveT.map(t => itemHtml("task", t)).join("")}</ul>
        <div class="row"><input id="newTask" placeholder="${p ? `「${esc(p.name)}」にタスク追加` : "先にプロジェクトを選択"}" ${p ? "" : "disabled"}><button id="addTask" ${p ? "" : "disabled"}>追加</button></div>
        ${doneT.length ? `<div class="note">完了：${doneT.map(t => `${esc(t.name)} <button data-reopen-task="${t.id}">再開</button>`).join(" ")}</div>` : ""}
      </div>
    </div>

    <h3>PRESET</h3>
    ${S.presets.map((x, i) => `<div class="prow"><span>${esc(hk["preset" + (i + 1)])}</span><select data-pp="${i}">${opt(live, x?.project_id, "（なし）")}</select><select data-pt="${i}">${opt((findPrj(x?.project_id)?.tasks || []).filter(t => !t.done), x?.task_id)}</select></div>`).join("")}
    <div class="note">同じキー＋Shift（例：Ctrl+Alt+Shift+1）で、今の選択をそのまま登録できます。</div>

    <h3>SETTING</h3>
    <div class="row">起動時：<select id="stMode"><option value="last">直前のタスクを引き継ぐ</option><option value="fixed">決まったタスクで始める</option></select></div>
    <div class="row" id="stFixedRow" style="display:${s.startup_mode === "fixed" ? "flex" : "none"}">　固定：<select id="stFp">${opt(live, s.fixed_project_id)}</select><select id="stFt">${opt((fixedP?.tasks || []).filter(t => !t.done), s.fixed_task_id)}</select></div>
    <div class="note" style="display:${s.startup_mode === "fixed" ? "block" : "none"}">その日最初に起動したとき（起動したまま日付が変わったときも）に、固定のタスクを選んだ状態にします。</div>
    <div class="row">無操作の判定：<input id="stIdle" type="number" min="1" max="240" style="flex:none;width:60px" value="${s.idle_minutes}">分</div>
    <div class="row">ショートカット：</div>
    ${[1, 2, 3].map(i => `<div class="prow"><span>プリセット${i}</span><input data-hk="preset${i}" value="${esc(hk["preset" + i])}"><span></span></div>${hkErr("preset" + i)}`).join("")}
    <div class="prow"><span>編集モード</span><input data-hk="edit" value="${esc(hk.edit)}"><span></span></div>${hkErr("edit")}
    <div class="row"><label><input type="checkbox" id="stAuto" ${S.autostart ? "checked" : ""}> PCの起動時に自動で立ち上げる</label></div>
    <div class="row">保存先：<span class="path">${esc(S.dataDir)}</span><button id="chDir">変更</button></div>

    <button class="close" id="closeEdit">DONE（ねじを押し戻す）</button>
    <button class="quit" id="quit">アプリを終了する</button>
    <div class="ver">case-timer v${esc(S.version || "")}</div>`;

  // プリセット
  S.presets.forEach((x, i) => {
    const ps = $("edit").querySelector(`[data-pp="${i}"]`), ts = $("edit").querySelector(`[data-pt="${i}"]`);
    ps.onchange = async () => { ts.innerHTML = opt((findPrj(+ps.value)?.tasks || []).filter(t => !t.done), null); if (!ps.value) applyState(await api().save_preset(i, null, null)); };
    ts.onchange = async () => { applyState(await api().save_preset(i, +ps.value || null, +ts.value || null)); renderEdit(); };
  });
  // 設定
  $("stMode").value = s.startup_mode;
  $("stMode").onchange = e => saveSettings({ startup_mode: e.target.value });
  $("stFp").onchange = e => saveSettings({ fixed_project_id: +e.target.value || null, fixed_task_id: null });
  $("stFt").onchange = e => saveSettings({ fixed_task_id: +e.target.value || null });
  $("stIdle").onchange = e => { const v = Math.max(1, Math.min(240, +e.target.value || 15)); saveSettings({ idle_minutes: v }); };
  $("edit").querySelectorAll("[data-hk]").forEach(inp => inp.onchange = () => saveSettings({ hotkeys: { [inp.dataset.hk]: inp.value.trim().toLowerCase() } }));
  $("stAuto").onchange = async e => { S.autostart = await api().set_autostart(e.target.checked); renderEdit(); };
  $("chDir").onclick = async () => {
    const r = await api().choose_data_dir();
    if (r.result === "cancel" || r.result === "same") return;
    if (r.result === "running") return toast("計測中は保存先を変更できません。STOPしてから変更してください。");
    S.dataDir = r.data_dir; S.settings = r.settings; applyState(r);
    toast(r.result === "opened" ? "保存先にあった既存の記録を開きました。" : "今の記録を新しい保存先にコピーして切り替えました。");
    renderEdit();
  };
  // 追加
  const addOnEnter = (id, fn) => { $(id).onkeydown = e => { if (e.key === "Enter") fn(); }; };
  const addPrj = async () => { const v = $("newPrj").value.trim(); if (!v) return; const r = await api().add_project(v); editPrj = r.new_id; applyState(r); renderEdit(); $("newTask")?.focus(); };
  const addTask = async () => { const v = $("newTask").value.trim(); if (!v || !p) return; applyState(await api().add_task(p.id, v)); renderEdit(); $("newTask").focus(); };
  $("addPrj").onclick = addPrj; addOnEnter("newPrj", addPrj);
  $("addTask").onclick = addTask; if (p) addOnEnter("newTask", addTask);
  // 名前変更の入力
  const ri = $("renameInput");
  if (ri) {
    ri.focus(); ri.select();
    ri.onkeydown = e => { if (e.key === "Enter") saveRename(); if (e.key === "Escape") { renaming = null; renderEdit(); } };
  }
  $("closeEdit").onclick = () => setEdit(false);
  $("quit").onclick = quitApp;
}
async function saveRename() {
  const v = $("renameInput").value.trim(), r = renaming; renaming = null;
  if (v) applyState(r.kind === "prj" ? await api().rename_project(r.id, v) : await api().rename_task(r.id, v));
  renderEdit();
}
$("edit").addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset.reopenPrj) { applyState(await api().set_project_done(+t.dataset.reopenPrj, false)); return renderEdit(); }
  if (t.dataset.reopenTask) { applyState(await api().set_task_done(+t.dataset.reopenTask, false)); return renderEdit(); }
  if (t.dataset.act === "rename-save") return saveRename();
  const li = t.closest("li[data-kind]"); if (!li) return;
  const kind = li.dataset.kind, id = +li.dataset.id;
  if (t.dataset.act === "rename") { renaming = { kind, id }; return renderEdit(); }
  if (t.dataset.act === "done") {
    applyState(kind === "prj" ? await api().set_project_done(id, true) : await api().set_task_done(id, true));
    if (kind === "prj" && editPrj === id) editPrj = S.projects.find(x => !x.done)?.id ?? null;
    return renderEdit();
  }
  if (kind === "prj") { editPrj = id; renaming = null; renderEdit(); }
});
async function saveSettings(patch) {
  const r = await api().save_settings(patch);
  S.settings = r.settings; S.hotkeyErrors = r.hotkey_errors;
  renderEdit();
}
function quitApp() {
  if (S.timer.status === "idle") return api().quit(false);
  showDialog(`計測中です（${esc(S.timer.label)}）。<br>STOPして記録してから終了しますか？`,
    [["STOPして終了", true, () => api().quit(true)], ["そのまま終了", false, () => api().quit(false)]]);
}

// ================= ねじ（りゅうず）のドラッグ =================
// 「カタめの動き」：引く方向も下げる方向も、あそび（わずかなガタつき）→ 止まる → 一気に入る、の3段階
const crown = $("crown"), hint = $("hint");
const PULL = 34, PULL_PLAY_PX = 6, PULL_PLAY_LEN = 3, PULL_GATE = 28, PULL_BACK = 16;
const PLAY_PX = 8, PLAY_DEG = 3, GATE = 46, BACK = 30, SHIFT_DEG = 38;
let drag = null;
function setArm(len, deg) { crown.style.setProperty("--len", len + "px"); crown.style.setProperty("--deg", deg + "deg"); }
function snap(cls, len, deg, shakeCls, ms) {
  crown.classList.add(cls);
  setArm(len, deg);
  stage.classList.remove(shakeCls); void stage.offsetWidth; stage.classList.add(shakeCls);
  if (drag) { drag.snapping = true; setTimeout(() => { if (drag) drag.snapping = false; crown.classList.remove(cls); }, ms); }
}
const clunk = deg => snap("clunk", PULL, deg, "shake", 130);
const kochi = len => snap("kochi", len, 0, "tick", 100);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const playDeg = d => clamp(d, -PLAY_PX, PLAY_PX) / PLAY_PX * PLAY_DEG;
const playLen = d => clamp(d, -PULL_PLAY_PX, PULL_PLAY_PX) / PULL_PLAY_PX * PULL_PLAY_LEN;
// 引き出したねじは、つかんだ位置から FREE_PX 以内ならどちらにもガタつくだけ（自由域）。
// 自由域を出た時点で、下へ動いた量が横より多ければ「倒す」、そうでなければ「横（引っ込める／伸ばす）」に決まる。
// 右はウィンドウの外になりがちで、倒すときに左下へずれやすいため、判定を急がずに余裕を持たせている
const FREE_PX = 14;
crown.addEventListener("pointerdown", e => {
  e.preventDefault();
  crown.setPointerCapture(e.pointerId);
  crown.classList.remove("spring", "clunk", "kochi");
  drag = { x: e.clientX, y: e.clientY, out: editMode, axis: null, shifted: false, snapping: false };
});
crown.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.out) {
    if (dx >= PULL_GATE) { drag.out = true; drag.axis = null; drag.x = e.clientX; drag.y = e.clientY; kochi(PULL); }
    else if (!drag.snapping) setArm(Math.max(0, playLen(dx)), 0); // 引っ込んだ状態：奥へは押し込めない
  } else {
    // 右へ動かしても何も起きないので、判定には使わない（引き出した勢いで右へ行き過ぎても、そのまま下げられる）
    const left = Math.max(0, -dx);
    // 自由域まで戻ってきたら、向きの判定をやり直す（倒す→戻す→そのまま引っ込める、を手を離さずにできるように）
    if (drag.axis === "v" && !drag.shifted && dy < FREE_PX) drag.axis = null;
    if (drag.axis === "h" && left < FREE_PX) drag.axis = null;
    if (!drag.axis &&Math.max(left, dy) >= FREE_PX) drag.axis = dy >= left ? "v" : "h";
    if (!drag.axis) {
      if (!drag.snapping) setArm(PULL + playLen(dx), playDeg(dy));
    } else if (drag.axis === "h") {
      if (dx <= -PULL_BACK) { drag.out = false; drag.axis = null; drag.x = e.clientX; drag.y = e.clientY; kochi(0); }
      else if (!drag.snapping) setArm(PULL + playLen(dx), 0);
    } else if (drag.axis === "v") {
      if (!drag.shifted && dy >= GATE) { drag.shifted = true; clunk(SHIFT_DEG); }
      else if (drag.shifted && dy < BACK) { drag.shifted = false; clunk(playDeg(dy)); }
      else if (!drag.snapping) setArm(PULL, drag.shifted ? SHIFT_DEG + playDeg(dy - GATE - PLAY_PX) : playDeg(dy));
    }
  }
  hint.textContent = drag.shifted ? "▼ ANALYSIS" : drag.out ? "EDIT" : "";
  hint.classList.toggle("show", drag.out);
});
function endDrag() {
  if (!drag) return;
  crown.classList.remove("clunk", "kochi"); crown.classList.add("spring");
  const { out, shifted } = drag; drag = null;
  reportShapeSoon();
  if (shifted) { setEdit(false); api().open_analysis(); return; }
  setEdit(out);
}
crown.addEventListener("pointerup", endDrag);
crown.addEventListener("pointercancel", endDrag);
crown.addEventListener("lostpointercapture", endDrag);
document.addEventListener("dragstart", e => e.preventDefault());

// ================= クリックを受け取る範囲 =================
// 背景を透明にすると、そのままでは筐体の上のクリックまで後ろのウィンドウに抜けてしまう。
// 筐体・ねじ・ミニバーの位置をPythonに伝え、その下だけを「透明でない色」で塗ってもらう（塗った色は筐体に隠れて見えない）。
// 揺れるアニメーションで端がのぞかないよう、少し内側に寄せる
let lastShape = "";
function reportShape() {
  const r = window.devicePixelRatio || 1, IN = 3, rects = [];
  const add = (el, cut = 0) => {
    const b = el.getBoundingClientRect();
    if (!b.width || !b.height) return;
    const box = (x, y, w, h) => rects.push([x, y, w, h].map(v => Math.round(v * r)));
    if (cut) { // 角を欠いた筐体：十字の2つの長方形で表す
      box(b.left + cut, b.top + IN, b.width - cut * 2, b.height - IN * 2);
      box(b.left + IN, b.top + cut, b.width - IN * 2, b.height - cut * 2);
    } else box(b.left + IN, b.top + IN, b.width - IN * 2, b.height - IN * 2);
  };
  if (document.body.classList.contains("minimode")) add($("mini"));
  else { add($("frame"), 10); add(document.querySelector(".crown-base")); add(crown.querySelector(".stem")); add(crown.querySelector(".head")); }
  const s = JSON.stringify(rects);
  if (s !== lastShape) { lastShape = s; api().set_shape(rects); }
}
const reportShapeSoon = () => setTimeout(reportShape, 250); // ねじの戻りアニメーション（0.18秒）が終わってから測る
window.addEventListener("resize", reportShapeSoon);

// ================= ミニモード =================
function setMini(on) {
  document.body.classList.toggle("minimode", on);
  api().set_mini(on);
  reportShapeSoon();
}
$("lcd").ondblclick = () => setMini(true);
$("mtime").ondblclick = () => setMini(false);
$("mini").onmouseenter = () => api().set_hover(true);
$("mini").onmouseleave = () => api().set_hover(false);

// ================= 起動 =================
window.addEventListener("pywebviewready", async () => {
  const b = await api().bootstrap();
  S.settings = b.settings; S.hotkeyErrors = b.hotkey_errors || {}; S.dataDir = b.data_dir; S.autostart = b.autostart; S.version = b.version;
  applyState(b);
  reportShapeSoon();
  if (b.recovery) {
    const r = b.recovery;
    showDialog(`前回、計測中のままアプリが終了していました。<br><b>${esc(r.label)}</b><br>${r.start.slice(5, 16)} 〜 ${r.last_alive.slice(5, 16)}（最後に動いていた時刻）<br>この時間を記録しますか？`,
      [["記録する", true, async () => applyState(await api().resolve_recovery(true))], ["記録しない", false, async () => applyState(await api().resolve_recovery(false))]]);
  } else if (Object.keys(S.hotkeyErrors).length) {
    toast("一部のショートカットを登録できませんでした。編集モードの設定で別のキーに変えてください。");
  } else if (!S.projects.length) {
    setEdit(true);
  }
  // ずれ防止に定期的に同期
  setInterval(async () => applyState(await api().get_state()), 30000);
});
</script>
